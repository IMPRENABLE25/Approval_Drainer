[profile.default]
src = "contracts/src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "write", path = "./deployments" }]

[profile.solutions]
test = "solutions/test"
script = "solutions/script"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
